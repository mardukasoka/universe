name: FITS reprojection smoke tests
on:
  pull_request:
    paths:
      - 'scripts/reproject_sky_fits.py'
      - 'tests/test_reproject_sky_fits.py'
      - '.github/workflows/fits-reprojection-tests.yml'
  workflow_dispatch:
jobs:
  synthetic-wcs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy astropy reproject pytest
      - name: Run WCS reprojection tests
        run: python -m pytest -q tests/test_reproject_sky_fits.py
